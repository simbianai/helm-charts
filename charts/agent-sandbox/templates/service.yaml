apiVersion: v1
kind: Service
metadata:
  labels:
    app: agent-sandbox-controller
  name: agent-sandbox-controller
  namespace: {{ .Values.namespace }}
spec:
  ports:
  - name: metrics
    port: 8080
    protocol: TCP
    targetPort: metrics
  selector:
    app: agent-sandbox-controller
---
apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-webhook-service
  namespace: {{ .Values.namespace }}
spec:
  ports:
  - name: webhook
    port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app: agent-sandbox-controller
